services:
  postgresql:
    image: postgres:16-alpine
    container_name: postgresql
    env_file:
      - backend/.env
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      # - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "${POSTGRESQL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$$POSTGRES_USER", "-d", "$$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend-net

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - backend-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KC_DB: dev-file
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: quan-ly-chi-tieu-api:latest
    container_name: backend
    # Override POSTGRES_HOST so the backend reaches Postgres via the compose
    # network DNS name "postgresql" rather than localhost (localhost inside
    # the container points to the container itself, not the host or siblings).
    environment:
      POSTGRES_HOST: postgresql
      ENVIRONMENT: development
    env_file:
      - backend/.env
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-net

volumes:
  postgresql_data:
  redis_data:

networks:
  backend-net:
    driver: bridge